
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Employee</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
            color: #333;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h1 {
            color: #263b5e;
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button, .btn {
            padding: 11px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
        }

        .btn-update {
            background: #2563eb;
            color: white;
        }

        .btn-cancel {
            background: #64748b;
            color: white;
            margin-left: 8px;
        }

        .field-error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 5px;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Edit Employee</h1>

        <div class="error"
             th:if="${error}"
             th:text="${error}">
        </div>

        <form th:action="@{/employees/{id}/update(id=${employee.id})}"
              th:object="${employee}"
              method="post">

            <div class="form-group">

                <label for="fullName">Full Name</label>

                <input type="text"
                       id="fullName"
                       th:field="*{fullName}">

                <span class="field-error"
                      th:if="${#fields.hasErrors('fullName')}"
                      th:errors="*{fullName}">
                </span>

            </div>

            <div class="form-group">

                <label for="email">Email</label>

                <input type="email"
                       id="email"
                       th:field="*{email}">

                <span class="field-error"
                      th:if="${#fields.hasErrors('email')}"
                      th:errors="*{email}">
                </span>

            </div>

            <div class="form-group">

                <label for="phone">Phone Number</label>

                <input type="text"
                       id="phone"
                       th:field="*{phone}">

                <span class="field-error"
                      th:if="${#fields.hasErrors('phone')}"
                      th:errors="*{phone}">
                </span>

            </div>

            <div class="form-group">

                <label for="department">Department</label>

                <input type="text"
                       id="department"
                       th:field="*{department}">

                <span class="field-error"
                      th:if="${#fields.hasErrors('department')}"
                      th:errors="*{department}">
                </span>

            </div>

            <div class="form-group">

                <label for="salary">Salary</label>

                <input type="number"
                       id="salary"
                       th:field="*{salary}"
                       step="0.01"
                       min="0.01">

                <span class="field-error"
                      th:if="${#fields.hasErrors('salary')}"
                      th:errors="*{salary}">
                </span>

            </div>

            <button type="submit" class="btn-update">
                Update Employee
            </button>

            <a th:href="@{/employees}" class="btn btn-cancel">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
