
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
            color: #333;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #263b5e;
        }

        h2 {
            color: #263b5e;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button, .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
            margin-top: 20px;
        }

        .btn-edit {
            background: #f59e0b;
            color: white;
        }

        .btn-delete {
            background: #dc2626;
            color: white;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .field-error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #263b5e;
            color: white;
        }

        tr:hover {
            background: #f8fafc;
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .actions form {
            margin: 0;
        }

        .empty-message {
            text-align: center;
            padding: 20px;
            color: #777;
        }

        @media (max-width: 700px) {
            body {
                padding: 12px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .table-wrapper {
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Employee Management System</h1>

    <!-- Success Message -->
    <div class="success"
         th:if="${success}"
         th:text="${success}">
    </div>

    <!-- Error Message -->
    <div class="error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <!-- Employee Registration Form -->
    <div class="card">

        <h2>Add New Employee</h2>

        <form th:action="@{/employees}"
              th:object="${employee}"
              method="post">

            <div class="form-grid">

                <div class="form-group">
                    <label for="fullName">Full Name</label>

                    <input type="text"
                           id="fullName"
                           th:field="*{fullName}"
                           placeholder="Enter full name">

                    <span class="field-error"
                          th:if="${#fields.hasErrors('fullName')}"
                          th:errors="*{fullName}">
                    </span>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>

                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           placeholder="Enter email address">

                    <span class="field-error"
                          th:if="${#fields.hasErrors('email')}"
                          th:errors="*{email}">
                    </span>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>

                    <input type="text"
                           id="phone"
                           th:field="*{phone}"
                           placeholder="Enter 10-digit phone number">

                    <span class="field-error"
                          th:if="${#fields.hasErrors('phone')}"
                          th:errors="*{phone}">
                    </span>
                </div>

                <div class="form-group">
                    <label for="department">Department</label>

                    <input type="text"
                           id="department"
                           th:field="*{department}"
                           placeholder="Enter department">

                    <span class="field-error"
                          th:if="${#fields.hasErrors('department')}"
                          th:errors="*{department}">
                    </span>
                </div>

                <div class="form-group">
                    <label for="salary">Salary</label>

                    <input type="number"
                           id="salary"
                           th:field="*{salary}"
                           step="0.01"
                           min="0.01"
                           placeholder="Enter salary">

                    <span class="field-error"
                          th:if="${#fields.hasErrors('salary')}"
                          th:errors="*{salary}">
                    </span>
                </div>

            </div>

            <button type="submit" class="btn-primary">
                Save Employee
            </button>

        </form>

    </div>

    <!-- Employee Table -->
    <div class="card">

        <h2>Employee Records</h2>

        <div class="table-wrapper">

            <table>

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Department</th>
                    <th>Salary</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="emp : ${employees}">

                    <td th:text="${emp.id}"></td>
                    <td th:text="${emp.fullName}"></td>
                    <td th:text="${emp.email}"></td>
                    <td th:text="${emp.phone}"></td>
                    <td th:text="${emp.department}"></td>
                    <td th:text="${emp.salary}"></td>

                    <td>
                        <div class="actions">

                            <!-- Edit Button -->
                            <a class="btn btn-edit"
                               th:href="@{/employees/{id}/edit(id=${emp.id})}">
                                Edit
                            </a>

                            <!-- Delete Button -->
                            <form th:action="@{/employees/{id}/delete(id=${emp.id})}"
                                  method="post"
                                  onsubmit="return confirm('Are you sure you want to delete this employee?');">

                                <button type="submit" class="btn-delete">
                                    Delete
                                </button>

                            </form>

                        </div>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="7" class="empty-message">
                        No employees found.
                    </td>
                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
